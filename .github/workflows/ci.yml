name: Flutter checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Bootstrap canonical platform runners
        run: dart tool/bootstrap_platforms.dart
      - run: flutter pub get
      - run: dart format lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web/

  android:
    name: Android debug APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap canonical platform runners
        run: dart tool/bootstrap_platforms.dart
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS Simulator build
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap canonical platform runners
        run: dart tool/bootstrap_platforms.dart
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-debug
          path: build/ios/iphonesimulator/

  windows:
    name: Windows release build
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Bootstrap canonical platform runners
        run: dart tool/bootstrap_platforms.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
